version: '3.8'

services:
  # QuestDB - Time-series database for market data
  questdb:
    image: questdb/questdb:7.3.10
    container_name: jarvis-questdb
    ports:
      - "9000:9000"  # HTTP/REST API
      - "9009:9009"  # InfluxDB line protocol
      - "8812:8812"  # PostgreSQL wire protocol
    volumes:
      - questdb-data:/var/lib/questdb
    environment:
      - QDB_TELEMETRY_ENABLED=false
      - QDB_PG_ENABLED=true
      - QDB_HTTP_ENABLED=true
      - QDB_LINE_TCP_ENABLED=true
    restart: unless-stopped
    networks:
      - jarvis-network

  # Redis - Caching layer
  redis:
    image: redis:7.2-alpine
    container_name: jarvis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass jarvis_redis_password
    restart: unless-stopped
    networks:
      - jarvis-network

  # PostgreSQL - Metadata and configuration storage
  postgres:
    image: postgres:15-alpine
    container_name: jarvis-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=jarvis_db
      - POSTGRES_USER=jarvis_user
      - POSTGRES_PASSWORD=jarvis_postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - jarvis-network

  # Prometheus - Metrics collection (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: jarvis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - jarvis-network

  # Grafana - Monitoring dashboards (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: jarvis-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=jarvis_admin
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - jarvis-network

networks:
  jarvis-network:
    driver: bridge

volumes:
  questdb-data:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
