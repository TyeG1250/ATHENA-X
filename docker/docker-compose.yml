version: '3.8'

services:
  # QuestDB - Time-series database for market data
  questdb:
    image: questdb/questdb:7.3.10
    container_name: athena-questdb
    ports:
      - "9000:9000"  # HTTP/REST API
      - "9009:9009"  # InfluxDB line protocol
      - "8812:8812"  # PostgreSQL wire protocol
    volumes:
      - questdb-data:/var/lib/questdb
    environment:
      - QDB_TELEMETRY_ENABLED=false
      - QDB_PG_ENABLED=true
      - QDB_HTTP_ENABLED=true
      - QDB_LINE_TCP_ENABLED=true
    restart: unless-stopped
    networks:
      - athena-network

  # Redis - Caching layer
  redis:
    image: redis:7.2-alpine
    container_name: athena-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass athena_redis_password
    restart: unless-stopped
    networks:
      - athena-network

  # PostgreSQL - Metadata and configuration storage
  postgres:
    image: postgres:15-alpine
    container_name: athena-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=athena_db
      - POSTGRES_USER=athena_user
      - POSTGRES_PASSWORD=athena_postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - athena-network

  # Prometheus - Metrics collection (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: athena-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - athena-network

  # Grafana - Monitoring dashboards (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: athena-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=athena_admin
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - athena-network

  # ATHENA-X Application
  athena-app:
    image: athena-x:latest
    container_name: athena-app
    volumes:
      - ../config:/app/config
      - ../logs:/app/logs
      - ../data:/app/data
      - ../.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=athena_redis_password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=athena_db
      - POSTGRES_USER=athena_user
      - POSTGRES_PASSWORD=athena_postgres_password
      - QUESTDB_HOST=questdb
      - QUESTDB_PORT=8812
    depends_on:
      - questdb
      - redis
      - postgres
    networks:
      - athena-network
    command: tail -f /dev/null  # Keep container running

networks:
  athena-network:
    driver: bridge

volumes:
  questdb-data:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
